amcl:
  ros__parameters:
    use_sim_time: true
    min_particles: 500
    max_particles: 2000
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    odom_model_type: "diff"
    update_min_d: 0.2
    update_min_a: 0.2
    resample_interval: 1
    laser_min_range: 0.1
    laser_max_range: 12.0
    laser_max_beams: 60
    transform_tolerance: 0.1

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true

local_costmap:
  ros__parameters:
    use_sim_time: true

global_costmap:
  ros__parameters:
    use_sim_time: true
